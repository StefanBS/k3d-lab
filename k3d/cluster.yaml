# The Lab's k3d cluster: 1 Server and 1 Agent on the Lab's own Docker network,
# with k3s's own networking disabled so Cilium is the only networking layer.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: lab
servers: 1
agents: 1
image: rancher/k3s:v1.37.1-k3s1
# Created by `just up` beforehand: fixed subnet, routable from the GPU Node (ADR 0002).
network: k3d-lab
kubeAPI:
  hostIP: 127.0.0.1
  hostPort: "6550"
# The Lab's Gateway listens on the Server's own network (platform/cilium/values.yaml).
# The ports go straight to the Server, since there is no k3d load balancer, and only on
# the Host's loopback, where *.lab.localhost always resolves (ADR 0003).
# The Server's k3s holds about 800MiB of live heap, mostly the API server's view of
# the Platform's CRDs. Go's default lets the heap grow to twice that before collecting;
# this soft limit makes it collect sooner instead. It costs a little CPU, which the
# Host has spare, unlike RAM.
env:
  - envVar: GOMEMLIMIT=1200MiB
    nodeFilters: [server:*]
ports:
  - port: 127.0.0.1:80:80
    nodeFilters: [server:0:direct]
  - port: 127.0.0.1:443:443
    nodeFilters: [server:0:direct]
options:
  k3d:
    disableLoadbalancer: true
  # Caps each k3d Node's memory, with room above what it uses settled, so a Lab that
  # grows evicts its own pods rather than pushing the Host's desktop into swap. k3d
  # shows each k3d Node its cap as its total memory, and the kubelet evicts below the
  # memory.available threshold set below.
  runtime:
    serversMemory: 5g
    agentsMemory: 3g
  k3s:
    extraArgs:
      - arg: --flannel-backend=none
        nodeFilters: [server:*]
      - arg: --disable-network-policy
        nodeFilters: [server:*]
      - arg: --disable-kube-proxy
        nodeFilters: [server:*]
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      # k3s sets only the disk thresholds, kept here, so without memory.available the
      # kubelet never evicts and a capped k3d Node is left to the OOM killer, which may
      # pick k3s itself. k3d states the cap in kB, which the kubelet reads as KiB, so it
      # sees 2.4% more memory than there is: 120MiB on the Server, within the 500Mi.
      - arg: --kubelet-arg=eviction-hard=imagefs.available<5%,nodefs.available<5%,memory.available<500Mi
        nodeFilters: [server:*, agent:*]
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
