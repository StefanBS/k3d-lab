kubeProxyReplacement: true
# The Server's fixed address on the Lab network: the first container on a fresh
# 172.28.0.0/16 network, then pinned there by `just up`. Also how the GPU Node reaches
# the API (ADR 0002). LAB_SERVER_IP in scripts/lib.sh, which `just lint` checks this
# against.
k8sServiceHost: 172.28.0.2
k8sServicePort: 6443
routingMode: tunnel
tunnelProtocol: vxlan
ipam:
  mode: kubernetes
operator:
  replicas: 1
# Inside a k3d Node, auto-mounting cgroup2 lands on the cilium-agent container's own cgroup, so the
# socket load balancer covers nothing and every ClusterIP times out. This only takes
# effect at install time: changing it later means recreating the Lab (ADR 0002).
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
hubble:
  # Hubble's certificates come from a Job in the Lab, not from Helm: Helm generates new
  # ones on every render, so ArgoCD would find Cilium out of sync forever.
  tls:
    auto:
      method: cronJob
  # The relay gathers the flows every node's agent sees, for the UI. The UI has no
  # login, like the Rollouts dashboard: its HTTPRoute for https://hubble.lab.localhost
  # is in platform/hubble.
  relay:
    enabled: true
    resources:
      requests: {cpu: 5m, memory: 32Mi}
  ui:
    enabled: true
    frontend:
      resources:
        requests: {cpu: 5m, memory: 16Mi}
    backend:
      resources:
        requests: {cpu: 5m, memory: 32Mi}
  # Each agent serves metrics of the flows it sees, labelled with the namespaces at
  # both ends. http only counts flows that pass through Cilium's L7 proxy, which only
  # an L7 rule in a network policy sends them through. Alloy scrapes them through the
  # ServiceMonitor in platform/hubble, not the chart's: `just up` installs Cilium
  # before the ServiceMonitor CRD exists.
  metrics:
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - httpV2:labelsContext=source_namespace,destination_namespace
# The Lab's Gateway (platform/gateway), whose CRDs `just up` applies before Cilium.
# Envoy listens on the Server's own network, which k3d publishes on the Host: there's no
# LoadBalancer. Only the Server listens, so a Joined GPU Node never opens ports 80 and
# 443 on the LAN. Changing these means recreating the Lab: cilium-agent only reads them
# at start.
gatewayAPI:
  enabled: true
  # Rendered whether or not the CRDs are there yet, so the Lab doesn't depend on
  # what the cluster held when ArgoCD last rendered Cilium.
  gatewayClass:
    create: "true"
  hostNetwork:
    enabled: true
    nodes:
      matchLabels:
        node-role.kubernetes.io/control-plane: "true"
# The taints Cilium runs despite, instead of the chart's every taint: networking must
# start on a node that isn't Ready yet, and on the GPU Node. Leaving out
# node.kubernetes.io/unreachable:NoSchedule means a Joined GPU Node that's powered off
# stops counting towards the DaemonSets, as it already does for Alloy and node-exporter,
# so they stay Healthy (ADR 0002). Their pod there isn't deleted: the DaemonSet
# controller tolerates unreachable:NoExecute itself. Envoy's DaemonSet runs on the same.
tolerations: &tolerations
  - {key: node.kubernetes.io/not-ready, operator: Exists}
  - {key: node.cilium.io/agent-not-ready, operator: Exists}
  - {key: node-role.kubernetes.io/control-plane, operator: Exists}
  - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
envoy:
  tolerations: *tolerations
  securityContext:
    capabilities:
      # Envoy binds ports 80 and 443, below 1024. The first two are the chart's default.
      keepCapNetBindService: true
      envoy: [NET_ADMIN, SYS_ADMIN, NET_BIND_SERVICE]
