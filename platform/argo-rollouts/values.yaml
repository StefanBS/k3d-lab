controller:
  # The chart runs two, for failover the Lab doesn't need.
  replicas: 1
  # Shifts a canary's traffic by setting the weights of its HTTPRoute's backends, which
  # the Lab's Gateway (Cilium) applies. The chart's providerRBAC already lets the
  # controller edit HTTPRoutes. The controller downloads the plugin when it starts, and
  # refuses it unless it has the checksum GitHub publishes for the release's asset.
  trafficRouterPlugins:
    - name: argoproj-labs/gatewayAPI
      location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.17.0/gatewayapi-plugin-linux-amd64
      sha256: 1904ca787d33107c140521899d61fff030ee75d99908bd175fca5a4647759061
  resources:
    requests: {cpu: 10m, memory: 64Mi}
# Shows every Rollout, and promotes or aborts one. It has no login of its own, so the
# Gateway asks oauth2-proxy (platform/oauth2-proxy/) about each request, which the Lab
# login opens (ADR 0013). The route still points at the dashboard's own Service.
dashboard:
  enabled: true
  httproute:
    enabled: true
    parentRefs:
      - name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - rollouts.lab.localhost
    rules:
      - filters:
          - type: ExternalAuth
            externalAuth:
              protocol: HTTP
              backendRef: {name: oauth2-proxy, namespace: sso, port: 80}
              http:
                # Envoy otherwise sends oauth2-proxy neither: it needs the cookie to
                # know the session, and the scheme to build its callback.
                allowedHeaders: [cookie, x-forwarded-proto]
                # Not optional on Cilium 1.20.2: without it, every header of
                # oauth2-proxy's answer is copied onto the request, its Content-Length
                # included, so a POST reaches the dashboard cut to 13 bytes
                # (cilium/cilium#48770). Any list does; oauth2-proxy doesn't send this
                # header here.
                allowedResponseHeaders: [x-auth-request-email]
  resources:
    requests: {cpu: 5m, memory: 32Mi}
