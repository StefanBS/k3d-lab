# oauth2-proxy, which signs the Lab login in to the UIs that have no login of their own
# (ADR 0013). The Gateway asks it about each request to them; it carries none.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oauth2-proxy.yaml
images:
  - name: quay.io/oauth2-proxy/oauth2-proxy
    newTag: v7.15.5
