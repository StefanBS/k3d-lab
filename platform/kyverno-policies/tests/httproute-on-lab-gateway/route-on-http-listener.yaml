# A bad HTTPRoute, which verify/policies-enforced/ also applies to the Lab. A route attaches to the https listener: only
# the redirect, in the namespace gateway, may use http, and this one is in another.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-on-http-listener
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: http
  hostnames: [policies-enforced.lab.localhost]
  rules:
    - backendRefs:
        - {name: web, port: 80}
