# A UI is served through the Lab's one Gateway: an HTTPRoute attaches to the https
# listener of the Gateway lab in the namespace gateway, for a name under lab.localhost,
# the only names the Lab CA signs and the Host resolves. The one exception is the
# Gateway's own plain-HTTP redirect: a route in the namespace gateway on its http
# listener, for every name.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: httproute-on-lab-gateway
spec:
  # Enforced, since the Lab passed it in Audit.
  validationActions: [Deny]
  # While Kyverno is down, objects are admitted unchecked, rather than not at all.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        # One version: the background scan can't resolve "*".
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  variables:
    # Each parentRef's listener of the Gateway lab, or '' for any other parent.
    - name: listeners
      expression: >-
        has(object.spec.parentRefs) ? object.spec.parentRefs.map(p,
        ((!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
        (!has(p.kind) || p.kind == 'Gateway') && p.name == 'lab' &&
        (has(p.namespace) ? p.namespace : object.metadata.namespace) == 'gateway' &&
        has(p.sectionName)) ? p.sectionName : '') : []
    - name: isRedirect
      expression: >-
        object.metadata.namespace == 'gateway' && size(variables.listeners) > 0 &&
        variables.listeners.all(l, l == 'http')
  validations:
    - expression: >-
        variables.isRedirect ||
        (size(variables.listeners) > 0 && variables.listeners.all(l, l == 'https'))
      message: >-
        parentRefs must be the https listener of the Gateway lab in the namespace gateway:
        {name: lab, namespace: gateway, sectionName: https}
    - expression: >-
        variables.isRedirect ||
        (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
        object.spec.hostnames.all(h, h.endsWith('.lab.localhost')))
      message: hostnames must be set, and each under lab.localhost
