# A GPU Workload is a DaemonSet that selects the GPU Node and tolerates its taint (ADR
# 0006), so it has no pod while the GPU Node is Left, and its Application stays Healthy.
# Anything else that requests amd.com/gpu would sit Pending then. Checked on each pod
# controller's template, Argo Rollouts' included, so a bad one fails its sync, and on
# each pod, as a backstop: Kyverno never sees ReplicaSets. Nothing here reads the
# nodes, so the result is the same whether or not the GPU Node is Joined.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: gpu-workload-shape
spec:
  # Enforced, since the Lab passed it in Audit.
  validationActions: [Deny]
  # While Kyverno is down, objects are admitted unchecked, rather than not at all.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [daemonsets, deployments, statefulsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  variables:
    # A Rollout that points at a Deployment (workloadRef) has no template of its own:
    # the Deployment's is checked.
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        has(object.spec.template) ? object.spec.template.spec : {'containers': []}
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
    - name: requestsGpu
      expression: >-
        variables.containers.exists(c, has(c.resources) &&
        ((has(c.resources.requests) && 'amd.com/gpu' in c.resources.requests) ||
        (has(c.resources.limits) && 'amd.com/gpu' in c.resources.limits)))
  validations:
    - expression: >-
        !variables.requestsGpu ||
        (object.kind == 'Pod' ?
        has(object.metadata.ownerReferences) &&
        object.metadata.ownerReferences.exists(o, o.kind == 'DaemonSet') :
        object.kind == 'DaemonSet')
      message: requests amd.com/gpu outside a DaemonSet; a GPU Workload is a DaemonSet (ADR 0006)
    - expression: >-
        !variables.requestsGpu ||
        (has(variables.podSpec.nodeSelector) &&
        'k3d-lab/gpu' in variables.podSpec.nodeSelector &&
        variables.podSpec.nodeSelector['k3d-lab/gpu'] == 'amd')
      message: requests amd.com/gpu without the nodeSelector k3d-lab/gpu=amd
    - expression: >-
        !variables.requestsGpu ||
        (has(variables.podSpec.tolerations) &&
        variables.podSpec.tolerations.exists(t,
        (has(t.key) && t.key != '' ?
        t.key == 'amd.com/gpu' &&
        ((has(t.operator) && t.operator == 'Exists') || !has(t.value) || t.value == '') :
        has(t.operator) && t.operator == 'Exists') &&
        (!has(t.effect) || t.effect == '' || t.effect == 'NoSchedule')))
      message: requests amd.com/gpu without tolerating the taint amd.com/gpu:NoSchedule
