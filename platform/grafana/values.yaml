# Anyone can look without logging in; changing things takes the Lab login, through Dex
# (auth.generic_oauth, below). The local admin stays as the Break-glass login, which ESO
# generates into the Secret named here (extraObjects, below). `just creds` prints both.
admin:
  existingSecret: grafana-admin
grafana.ini:
  server:
    root_url: https://grafana.lab.localhost
  auth.anonymous:
    enabled: true
    org_role: Viewer
  # Single sign-on with the Lab login, through Dex at https://sso.lab.localhost
  # (ADR 0013). The client secret comes from the environment (envValueFrom, below).
  auth.generic_oauth:
    enabled: true
    name: Lab
    client_id: grafana
    scopes: openid email profile
    auth_url: https://sso.lab.localhost/auth
    token_url: https://sso.lab.localhost/token
    api_url: https://sso.lab.localhost/userinfo
    # Dex's certificate is from the Lab CA (extraConfigmapMounts, below).
    tls_client_ca: /etc/lab-ca/ca.crt
    # Dex gives a static user no groups, so Admin goes to the Lab login's email. The
    # strings take single quotes: with backticks, it silently gives Viewer.
    role_attribute_path: email == 'lab@lab.localhost' && 'Admin' || 'Viewer'
  # Grafana otherwise downloads a set of plugins at every start, which nothing here uses.
  plugins:
    preinstall_disabled: true
# Nothing to keep: datasources come from here and dashboards from Git, and a new Lab
# starts empty anyway.
persistence:
  enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc:3100
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.monitoring.svc:3200
        jsonData:
          # A span's logs: its pod's, in Loki, from a minute before it to a minute
          # after. Alloy tags every span with the namespace and pod that sent it.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            tags:
              - {key: k8s.namespace.name, value: namespace}
              - {key: k8s.pod.name, value: pod}
          # A span's metrics: its service's span metrics, which Tempo writes to
          # Prometheus. Grafana would read a single $ as an environment variable.
          tracesToMetrics:
            datasourceUid: prometheus
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            tags:
              - {key: service.name, value: service}
            queries:
              - name: Requests per second
                query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[1m]))
              - name: Errors per second
                query: sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags, status_code="STATUS_CODE_ERROR"}[1m]))
          # The service graph that Tempo writes to Prometheus.
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true
# Grafana's OIDC client secret, from the Secret grafana-sso (extraObjects, below).
# Grafana's pod waits for it, as it does for the admin login's.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-sso
      key: client-secret
# The Lab CA, which `just up` puts in this namespace.
extraConfigmapMounts:
  - name: lab-ca
    configMap: lab-ca
    mountPath: /etc/lab-ca
    readOnly: true
# Loads every ConfigMap labelled grafana_dashboard in this namespace, as
# platform/grafana-dashboards/ makes them.
sidecar:
  dashboards:
    enabled: true
  resources:
    requests: {cpu: 5m, memory: 64Mi}
route:
  main:
    enabled: true
    parentRefs:
      - name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - grafana.lab.localhost
# The chart's `helm test` pod, which ArgoCD never runs.
testFramework:
  enabled: false
# Modest requests for a Host short on RAM.
resources:
  requests: {cpu: 25m, memory: 128Mi}
# The admin login: a new password for each Lab, generated once, so it never goes in
# Git. Grafana's pod waits for the Secret. The chart runs these through tpl, so they
# use no ESO templates: rewrite renames the generator's key, and Merge adds the user.
# The last is the OIDC client secret, from the Secret Store: the same value Dex has.
extraObjects:
  - apiVersion: generators.external-secrets.io/v1alpha1
    kind: Password
    metadata:
      name: grafana-admin
    spec:
      length: 32
      digits: 8
      symbols: 0
      noUpper: false
      allowRepeat: true
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-admin
    spec:
      refreshPolicy: CreatedOnce
      target:
        name: grafana-admin
        template:
          mergePolicy: Merge
          data:
            admin-user: admin
      dataFrom:
        - sourceRef:
            generatorRef:
              apiVersion: generators.external-secrets.io/v1alpha1
              kind: Password
              name: grafana-admin
          rewrite:
            - regexp: {source: ^password$, target: admin-password}
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: grafana-sso
    spec:
      refreshInterval: "0"
      secretStoreRef:
        kind: ClusterSecretStore
        name: secret-store-platform
      target:
        name: grafana-sso
      data:
        - secretKey: client-secret
          remoteRef:
            key: platform/sso/clients/grafana
            property: secret
