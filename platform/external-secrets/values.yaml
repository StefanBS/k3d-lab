# ESO logs in to the Secret Store on the Host with Kubernetes auth (ADR 0003). OpenBao
# holds no token of the Lab's: it checks ESO's own short-lived token with a
# TokenReview made with that same token, which this ClusterRole allows.
systemAuthDelegator: true
# Every Workload's ExternalSecret reads from here, with
# secretStoreRef {kind: ClusterSecretStore, name: secret-store}, and remoteRef.key
# workloads/<workload>/<key>: a secret at lab/workloads/<workload>/<key> in OpenBao.
# `just up` creates the ConfigMap lab-ca, and points OpenBao's Kubernetes auth at the
# new Lab, with the role eso: read-only, on lab/workloads/* alone. Wave 1 waits for
# ESO's webhook, which must admit it.
extraObjects:
  - |
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: secret-store
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      provider:
        vault:
          server: https://host.k3d.internal:8200
          path: lab
          version: v2
          caProvider:
            type: ConfigMap
            name: lab-ca
            namespace: external-secrets
            key: ca.crt
          auth:
            kubernetes:
              mountPath: kubernetes
              role: eso
              # The role eso accepts only tokens meant for the Secret Store: the first
              # audience, which `just up` reads from here. OpenBao checks each token
              # with a TokenReview made with that same token, so it must also be meant
              # for the API server, the second.
              serviceAccountRef:
                name: external-secrets
                namespace: external-secrets
                audiences:
                  - k3d-lab-secret-store
                  - https://kubernetes.default.svc.cluster.local
  # The Platform's own way into the Secret Store (ADR 0013), for the Lab login and the
  # OIDC clients' secrets at lab/platform/*: a ServiceAccount of its own, which `just up`
  # binds to the role eso-platform, read-only on lab/platform/* alone. So no Workload's
  # ExternalSecret can read them: the role eso can't, and only the namespaces under
  # `conditions` may use this ClusterSecretStore.
  - |
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: external-secrets-platform
  # OpenBao checks this ServiceAccount's tokens with a TokenReview too, and the chart's
  # systemAuthDelegator only covers ESO's own.
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: external-secrets-platform-auth-delegator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: system:auth-delegator
    subjects:
      - kind: ServiceAccount
        name: external-secrets-platform
        namespace: external-secrets
  - |
    apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: secret-store-platform
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      conditions:
        - namespaces: [sso, argocd, monitoring]
      provider:
        vault:
          server: https://host.k3d.internal:8200
          path: lab
          version: v2
          caProvider:
            type: ConfigMap
            name: lab-ca
            namespace: external-secrets
            key: ca.crt
          auth:
            kubernetes:
              mountPath: kubernetes
              role: eso-platform
              # The same audiences as the role eso's, above.
              serviceAccountRef:
                name: external-secrets-platform
                namespace: external-secrets
                audiences:
                  - k3d-lab-secret-store
                  - https://kubernetes.default.svc.cluster.local
# How the controller reaches the Secret Store: host.k3d.internal is the Host's address
# on the Lab network, LAB_GATEWAY in scripts/lib.sh, which `just lint` checks this
# against. Only ESO talks to the Secret Store, so only its controller resolves the name.
# k3d also writes it into CoreDNS's NodeHosts, but k3s resets those whenever its
# CoreDNS addon is applied again, such as when a k3d Node restarts.
hostAliases:
  - ip: 172.28.0.1
    hostnames: [host.k3d.internal]
# Modest requests for a Host short on RAM.
resources:
  requests: {cpu: 10m, memory: 64Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
