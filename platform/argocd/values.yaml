global:
  domain: argocd.lab.localhost
configs:
  params:
    # Plain HTTP behind the Lab's Gateway, which terminates TLS in front of it.
    server.insecure: true
    # Diff against what the API server would store, defaults included. Otherwise the
    # defaults that CRD schemas fill in, such as Gateway API's parentRefs group and
    # kind, keep Applications OutOfSync forever.
    controller.diff.server.side: true
server:
  httproute:
    enabled: true
    parentRefs:
      - name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.localhost
  resources:
    requests: {cpu: 10m, memory: 64Mi}
# Nothing logs in through SSO or needs notifications in the Lab, so neither runs.
dex:
  enabled: false
notifications:
  enabled: false
# Modest requests for a Host short on RAM; every component runs one replica.
controller:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
  env:
    # A request to GitHub gives up after 15s, and by default the first failure is final,
    # so a Host whose Wi-Fi drops for seconds fails a refresh, and the error stays on the
    # Application for minutes (#159). Three attempts ride out 30s. A fourth can't help:
    # the controller stops waiting for the repo server after 60s.
    - name: ARGOCD_GIT_ATTEMPTS_COUNT
      value: "3"
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
