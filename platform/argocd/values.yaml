configs:
  params:
    # Only for its side effect: an ApplicationSet's status then follows its
    # Applications' health as it changes, rather than at the next requeue, minutes
    # later. The health check below reads that status. No ApplicationSet uses RollingSync.
    applicationsetcontroller.enable.progressive.syncs: true
    # Plain HTTP until the Gateway terminates TLS in front of it.
    server.insecure: true
  cm:
    # An ApplicationSet is Healthy once every Application it generated is Synced and
    # Healthy; the root Application uses that to create Workloads after the Platform.
    # ArgoCD's own check only reports whether the Applications were generated.
    resource.customizations.health.argoproj.io_ApplicationSet: |
      local hs = {status = "Progressing", message = "Waiting for the Applications to be generated"}
      if obj.status == nil or obj.status.conditions == nil then
        return hs
      end
      local generated = false
      for _, condition in ipairs(obj.status.conditions) do
        if condition.type == "ErrorOccurred" and condition.status == "True" then
          return {status = "Degraded", message = condition.message}
        end
        if condition.type == "ResourcesUpToDate" then
          if condition.status == "False" then
            return {status = "Degraded", message = condition.message}
          end
          generated = condition.status == "True"
        end
      end
      if not generated then
        return hs
      end
      for _, app in ipairs(obj.status.resources or {}) do
        if app.status ~= "Synced" or app.health == nil or app.health.status ~= "Healthy" then
          return {status = "Progressing", message = "Waiting for Application " .. app.name}
        end
      end
      return {status = "Healthy", message = "Every Application is Synced and Healthy"}
# Nothing logs in through SSO or needs notifications in the Lab, so neither runs.
dex:
  enabled: false
notifications:
  enabled: false
# Modest requests for a Host short on RAM; every component runs one replica.
controller:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
server:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
