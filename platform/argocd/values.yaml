global:
  domain: argocd.lab.localhost
configs:
  params:
    # Plain HTTP behind the Lab's Gateway, which terminates TLS in front of it.
    server.insecure: true
    # Diff against what the API server would store, defaults included. Otherwise the
    # defaults that CRD schemas fill in, such as Gateway API's parentRefs group and
    # kind, keep Applications OutOfSync forever.
    controller.diff.server.side: true
    # Keep each resource's health in its Application, as before ArgoCD 3: verify's
    # applications-healthy.sh tells a GPU Node that's off from a real failure by it.
    controller.resource.health.persist: true
server:
  httproute:
    enabled: true
    parentRefs:
      - name: lab
        namespace: gateway
        sectionName: https
    hostnames:
      - argocd.lab.localhost
  resources:
    requests: {cpu: 10m, memory: 64Mi}
# Nothing logs in through SSO or needs notifications in the Lab, so neither runs.
dex:
  enabled: false
notifications:
  enabled: false
# Modest requests for a Host short on RAM; every component runs one replica.
controller:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
repoServer:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
applicationSet:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
