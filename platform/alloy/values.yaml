# The Lab's only collector. One Alloy per node scrapes only what runs on its own node:
# the kubelet, cAdvisor, and the targets of every ServiceMonitor and PodMonitor, such as
# node-exporter's and kube-state-metrics'. It remote-writes them all to Prometheus, and
# labels each series with its node.
# Targets without a pod behind them, such as a ServiceMonitor on the API server's own
# endpoints, belong to no node, so nothing scrapes them.
# It also reads the logs of every pod on its node and pushes them to Loki, each labelled
# with its namespace, pod, container and node.
alloy:
  configMap:
    content: |
      // K8S_NODE_NAME is the chart's: the node this Alloy runs on.
      discovery.kubernetes "this_node" {
        role = "node"
        selectors {
          role  = "node"
          field = "metadata.name=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "this_node" {
        targets = discovery.kubernetes.this_node.targets
        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }
      }

      prometheus.scrape "kubelet" {
        job_name          = "kubelet"
        targets           = discovery.relabel.this_node.output
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = [prometheus.remote_write.prometheus.receiver]
      }

      prometheus.scrape "cadvisor" {
        job_name          = "cadvisor"
        targets           = discovery.relabel.this_node.output
        metrics_path      = "/metrics/cadvisor"
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        }
        forward_to = [prometheus.remote_write.prometheus.receiver]
      }

      prometheus.operator.servicemonitors "this_node" {
        forward_to = [prometheus.remote_write.prometheus.receiver]
        scrape {
          default_scrape_interval = "30s"
        }
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      prometheus.operator.podmonitors "this_node" {
        forward_to = [prometheus.remote_write.prometheus.receiver]
        scrape {
          default_scrape_interval = "30s"
        }
        rule {
          action        = "keep"
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
      }

      prometheus.remote_write "prometheus" {
        endpoint {
          url = "http://prometheus-server.monitoring.svc/api/v1/write"
        }
      }

      // The kubelet writes each container's logs to
      // /var/log/pods/<namespace>_<pod>_<uid>/<container>/<restart count>.log.
      discovery.kubernetes "this_node_pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.this_node_pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Strips the container runtime's timestamp and stream prefix off each line.
      loki.process "pod_logs" {
        stage.cri {}
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }
  # The node's /var/log, read-only, for the pods' logs.
  mounts:
    varlog: true
    # Where Alloy remembers how far it has read each log file. On the node rather than
    # in the container, so that a restarted or replaced Alloy, as after every chart
    # upgrade, carries on where it stopped instead of sending every log again.
    extra:
      - {name: storage, mountPath: /var/lib/alloy}
  storagePath: /var/lib/alloy
  # Modest requests for a Host short on RAM.
  resources:
    requests: {cpu: 25m, memory: 128Mi}
configReloader:
  resources:
    requests: {cpu: 5m, memory: 16Mi}
controller:
  type: daemonset
  volumes:
    extra:
      - name: storage
        hostPath: {path: /var/lib/alloy, type: DirectoryOrCreate}
  # Runs on the GPU Node too, once it's Joined.
  tolerations:
    - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
