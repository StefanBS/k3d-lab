# What Dex reads from its environment, from the Secret Store (ADR 0013): the Lab login's
# password, as the bcrypt hash Dex wants, and each client's secret, under the names
# config.yaml gives them. Rendered once: bcrypt salts every hash, so a refresh would
# change the Secret each time.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex
spec:
  refreshInterval: "0"
  secretStoreRef: {kind: ClusterSecretStore, name: secret-store-platform}
  target:
    name: dex
    template:
      data:
        LAB_LOGIN_HASH: '{{ .password | bcrypt }}'
        OAUTH2_PROXY_CLIENT_SECRET: '{{ .oauth2proxy }}'
        ARGOCD_CLIENT_SECRET: '{{ .argocd }}'
        GRAFANA_CLIENT_SECRET: '{{ .grafana }}'
  data:
    - secretKey: password
      remoteRef: {key: platform/sso/login, property: password}
    - secretKey: oauth2proxy
      remoteRef: {key: platform/sso/clients/oauth2-proxy, property: secret}
    - secretKey: argocd
      remoteRef: {key: platform/sso/clients/argocd, property: secret}
    - secretKey: grafana
      remoteRef: {key: platform/sso/clients/grafana, property: secret}
---
# Dex keeps its state as custom resources in this namespace (config.yaml's `storage`),
# and creates their CRDs as it starts. It may do no more than that with the Lab's API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex
rules:
  - apiGroups: [dex.coreos.com]
    resources: ["*"]
    verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex
subjects:
  - {kind: ServiceAccount, name: dex}
---
# Creating a CRD can't be limited to Dex's own: a rule can't name what doesn't exist yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dex
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dex
subjects:
  - {kind: ServiceAccount, name: dex, namespace: sso}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  # Two, which share their state (config.yaml's `storage`): a sign-in's requests can
  # each reach either, and one can restart while the other signs in.
  replicas: 2
  selector:
    matchLabels: {app: dex}
  template:
    metadata:
      labels: {app: dex}
    spec:
      serviceAccountName: dex
      # On different nodes when two can take them, so one node's restart leaves a Dex.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: dex}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex
          args: [dex, serve, /etc/dex/config.yaml]
          # The pod waits for the Secret, which ESO makes.
          envFrom:
            - secretRef: {name: dex}
          env:
            # The `sessions` block of config.yaml needs it.
            - {name: DEX_SESSIONS_ENABLED, value: "true"}
          ports:
            - {name: http, containerPort: 5556}
          readinessProbe:
            httpGet: {path: /.well-known/openid-configuration, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/dex}
      volumes:
        - name: config
          configMap: {name: dex}
---
apiVersion: v1
kind: Service
metadata:
  name: dex
spec:
  selector: {app: dex}
  ports:
    - {name: http, port: 80, targetPort: http}
---
# The issuer's address, for the browser. Pods reach the same name through CoreDNS
# (platform/coredns-custom/).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - sso.lab.localhost
  rules:
    - backendRefs:
        - {name: dex, port: 80}
