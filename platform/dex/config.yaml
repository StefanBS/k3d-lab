# Dex's config, with no secret in it: Dex reads the Lab login's hash and each client's
# secret from its environment (the Secret dex, in dex.yaml). `just host setup` and
# `just up` read the clients that have a secretEnv from here (scripts/sso-state.sh), so a
# new one gets its secret in the Secret Store at the next `just host setup`.
issuer: https://sso.lab.localhost
# Nothing to keep: a restart only ends the logins in progress, and makes new signing keys.
storage: {type: memory}
web: {http: 0.0.0.0:5556}
oauth2:
  skipApprovalScreen: true
  # The password grant, which only Verify's check sso-login uses.
  passwordConnector: local
enablePasswordDB: true
# The Lab login. Dex signs it in by its email: the username is only a claim. A static
# user has no groups, so each UI maps its admin role to the email.
staticPasswords:
  - email: lab@lab.localhost
    username: lab
    userID: 0b0d7f5a-6f0e-4c53-9d2c-6a1f3e2b7a74
    hashFromEnv: LAB_LOGIN_HASH
staticClients:
  # The UIs with no login of their own, which oauth2-proxy signs in: each one's callback
  # is on its own host (platform/oauth2-proxy/).
  - id: oauth2-proxy
    name: Lab UIs
    secretEnv: OAUTH2_PROXY_CLIENT_SECRET
    redirectURIs:
      - https://hubble.lab.localhost/oauth2/callback
      - https://rollouts.lab.localhost/oauth2/callback
  - id: argocd
    name: ArgoCD
    secretEnv: ARGOCD_CLIENT_SECRET
    redirectURIs: [https://argocd.lab.localhost/auth/callback]
  - id: grafana
    name: Grafana
    secretEnv: GRAFANA_CLIENT_SECRET
    redirectURIs: [https://grafana.lab.localhost/login/generic_oauth]
  # Verify's check sso-login. Public and without a redirect URI, so it can only use the
  # password grant, which needs the Lab login's password anyway.
  - id: verify
    name: Verify
    public: true
