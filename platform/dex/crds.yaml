# The custom resources Dex keeps its state in (config.yaml's `storage`), as Dex 2.46
# defines them in storage/kubernetes/types.go: odd plurals included, and no schema. Dex
# can create them itself, but that takes the right to create any CRD in the Lab. Here
# ArgoCD owns them, and Dex only checks they're there (`crdHandling: check`): if a new
# Dex wants one more, it says "CRDs are not created" and doesn't start, until it's added
# here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: authcodes.dex.coreos.com
spec:
  group: dex.coreos.com
  scope: Namespaced
  names: {plural: authcodes, singular: authcode, kind: AuthCode}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema: {type: object, x-kubernetes-preserve-unknown-fields: true}
---
