# Dex, the Lab's single sign-on provider, at https://sso.lab.localhost (ADR 0013). It
# keeps nothing: one static user, the Lab login, and the clients in config.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dex.yaml
# A change to the config restarts Dex, through the ConfigMap's name.
configMapGenerator:
  - name: dex
    files:
      - config.yaml
images:
  - name: ghcr.io/dexidp/dex
    newTag: v2.46.0
