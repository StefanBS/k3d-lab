crds:
  enabled: true
# Signs with the Lab CA, which `just up` loads into this namespace as the Secret lab-ca
# (ADR 0003). A Certificate asks for it with issuerRef {kind: ClusterIssuer, name: lab-ca}.
# Wave 1 waits for cert-manager's webhook, which must admit it.
extraObjects:
  - |
    apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    metadata:
      name: lab-ca
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      ca:
        secretName: lab-ca
# Modest requests for a Host short on RAM.
resources:
  requests: {cpu: 10m, memory: 64Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 64Mi}
