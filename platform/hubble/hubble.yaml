# Hubble UI, which shows the flows Hubble Relay gathers from every node, live. It has no
# login, like the Rollouts dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - hubble.lab.localhost
  rules:
    - backendRefs:
        - {name: hubble-ui, port: 80}
---
# The flow metrics every cilium-agent serves, which the Alloy on its node scrapes. The
# same as the chart's own, which Cilium can't ship: `just up` installs Cilium before
# this CRD exists, and ArgoCD retries this until it does.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble
spec:
  selector:
    matchLabels: {k8s-app: hubble}
  endpoints:
    - port: hubble-metrics
      honorLabels: true
