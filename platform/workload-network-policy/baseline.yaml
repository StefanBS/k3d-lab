# What every Workload's pod may do without a policy of its own. Everything else, in
# and out, is denied until a policy allows it: cross-namespace isolation comes from
# that default, not from a deny rule, which would win over the allows a Workload
# writes to reach another namespace. The kubelet's probes need no rule: Cilium always
# lets a node reach its own pods.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: workload-baseline
spec:
  endpointSelector:
    matchLabels: {k8s:io.cilium.k8s.namespace.labels.k3d-lab/group: workloads}
  enableDefaultDeny: {ingress: true, egress: true}
  # Name lookups, through Cilium's DNS proxy, so Hubble sees each query, and so a
  # Workload's FQDN rules know which addresses each name had.
  egress:
    - toEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns}
      toPorts:
        - ports: [{port: "53", protocol: ANY}]
          rules:
            dns: [{matchPattern: "*"}]
---
# The Gateway, whose Envoy has the ingress identity, to a pod's port named http. That
# exposes nothing by itself: the Gateway only sends a pod traffic when an HTTPRoute
# names its Service. L4 only, so websockets pass. A Workload's own L7 rule on the same
# port, such as rollouts-demo's, still sends its requests through Cilium's L7 proxy.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: workload-baseline-gateway
spec:
  endpointSelector:
    matchLabels: {k8s:io.cilium.k8s.namespace.labels.k3d-lab/group: workloads}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: http, protocol: TCP}]
---
# Alloy to a pod's port named metrics, which it scrapes when a PodMonitor or
# ServiceMonitor names it.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: workload-baseline-alloy
spec:
  endpointSelector:
    matchLabels: {k8s:io.cilium.k8s.namespace.labels.k3d-lab/group: workloads}
  ingress:
    - fromEndpoints:
        - matchLabels: {k8s:io.kubernetes.pod.namespace: monitoring, app.kubernetes.io/name: alloy}
      toPorts:
        - ports: [{port: metrics, protocol: TCP}]
