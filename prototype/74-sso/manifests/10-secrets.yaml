# PROTOTYPE (#74). The second way into the Secret Store: its own ServiceAccount and
# OpenBao role (eso-platform, made by up.sh), reading lab/platform/* only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-platform
  namespace: external-secrets
---
# OpenBao reviews each login's token with that same token, as for the role eso.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-platform-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: external-secrets-platform
    namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: secret-store-platform
spec:
  # Only Platform namespaces may read through it.
  conditions:
    - namespaces: [sso, argocd, monitoring]
  provider:
    vault:
      server: https://host.k3d.internal:8200
      path: lab
      version: v2
      caProvider:
        type: ConfigMap
        name: lab-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform
          serviceAccountRef:
            name: external-secrets-platform
            namespace: external-secrets
            audiences:
              - k3d-lab-secret-store
              - https://kubernetes.default.svc.cluster.local
---
# Point 5: the Secret Store holds the password; this renders the bcrypt hash Dex needs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex
  namespace: sso
spec:
  refreshInterval: "0"
  secretStoreRef: {kind: ClusterSecretStore, name: secret-store-platform}
  target:
    name: dex
    template:
      data:
        LAB_LOGIN_HASH: '{{ .password | bcrypt }}'
        OAUTH2_PROXY_CLIENT_SECRET: '{{ .oauth2proxy }}'
        ARGOCD_CLIENT_SECRET: '{{ .argocd }}'
        GRAFANA_CLIENT_SECRET: '{{ .grafana }}'
  data:
    - secretKey: password
      remoteRef: {key: platform/sso/login, property: password}
    - secretKey: oauth2proxy
      remoteRef: {key: platform/sso/clients/oauth2-proxy, property: secret}
    - secretKey: argocd
      remoteRef: {key: platform/sso/clients/argocd, property: secret}
    - secretKey: grafana
      remoteRef: {key: platform/sso/clients/grafana, property: secret}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy
  namespace: sso
spec:
  refreshInterval: "0"
  secretStoreRef: {kind: ClusterSecretStore, name: secret-store-platform}
  target:
    name: oauth2-proxy
  data:
    - secretKey: client-secret
      remoteRef: {key: platform/sso/clients/oauth2-proxy, property: secret}
    - secretKey: cookie-secret
      remoteRef: {key: platform/sso/clients/oauth2-proxy, property: cookie}
