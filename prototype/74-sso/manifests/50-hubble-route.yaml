# PROTOTYPE (#74). Point 1: platform/hubble's HTTPRoute, with the auth check added. It
# still points at the real Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
    - {name: lab, namespace: gateway, sectionName: https}
  hostnames: [hubble.lab.localhost]
  rules:
    - filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP
            backendRef: {name: oauth2-proxy, namespace: sso, port: 80}
            http:
              allowedHeaders: [cookie, x-forwarded-proto]
              # Must be set. Without it Cilium 1.20.2 copies every header of the
              # auth answer onto the request, its Content-Length included, so the
              # UI gets a POST cut to 13 bytes (fixed on main by cilium/cilium#48770).
              allowedResponseHeaders: [x-auth-request-email]
      backendRefs:
        - {name: hubble-ui, port: 80}
