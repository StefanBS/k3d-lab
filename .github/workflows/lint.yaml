name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs every tool in mise.toml, at the versions the Host uses.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.0
      - run: just lint
