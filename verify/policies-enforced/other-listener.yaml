# The bad HTTPRoute this check applies, and that lint tests httproute-on-lab-gateway
# on (platform/kyverno-policies/tests/): the plain-HTTP listener, outside gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: other-listener
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: http
  hostnames: [policies-enforced.lab.localhost]
  rules:
    - backendRefs:
        - {name: web, port: 80}
