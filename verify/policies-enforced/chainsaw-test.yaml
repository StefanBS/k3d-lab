apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policies-enforced
spec:
  description: >-
    Kyverno's enforced policies (platform/kyverno-policies/) reject a bad object, naming
    the policy: a Deployment that requests amd.com/gpu (gpu-workload-shape), and an
    HTTPRoute on another parent than the https listener of gateway/lab
    (httproute-on-lab-gateway). A Pod whose image has no tag is admitted, as
    images-pinned only audits, and shows up failing it in its namespace's PolicyReport.
    None of it reaches a node.
  steps:
    - try:
        # Fixtures of lint's tests of their policy, the one place they're written.
        - apply:
            file: ../../platform/kyverno-policies/tests/gpu-workload-shape/gpu-deployment.yaml
            expect:
              - check:
                  (contains($error || '', 'gpu-workload-shape')): true
        - apply:
            file: ../../platform/kyverno-policies/tests/httproute-on-lab-gateway/route-on-http-listener.yaml
            expect:
              - check:
                  (contains($error || '', 'httproute-on-lab-gateway')): true
        # Never scheduled: no node has the label, so nothing pulls the image.
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: unpinned
              spec:
                nodeSelector: {k3d-lab/verify: never}
                containers:
                  - name: unpinned
                    image: busybox
        # Only the reports controller's background scan reports on the pod. It picks up a
        # new object 30s after it sees it (Kyverno's enqueueDelay), so the report comes
        # about 45s after the pod, or after the controller's last start if it restarts.
        - assert:
            resource:
              apiVersion: wgpolicyk8s.io/v1alpha2
              kind: PolicyReport
              scope:
                kind: Pod
                name: unpinned
              (length(results[?policy == 'images-pinned' && result == 'fail']) > `0`): true
      catch:
        # An EphemeralReport without a PolicyReport means the scan reached the pod, but
        # the reports controller hasn't folded it into a PolicyReport yet.
        - script:
            content: kubectl -n "$NAMESPACE" get ephemeralreports,policyreports -o yaml
        # A reports controller that restarted while the check waited, such as when it
        # lost its leader lease to a slow API server, starts its scan over.
        - script:
            content: |
              kubectl -n kyverno get pods -l app.kubernetes.io/component=reports-controller \
                -o custom-columns='NAME:.metadata.name,RESTARTS:.status.containerStatuses[0].restartCount,STARTED:.status.containerStatuses[0].state.running.startedAt,LAST EXIT:.status.containerStatuses[0].lastState.terminated.finishedAt'
              lease=$(kubectl -n kyverno logs deploy/kyverno-reports-controller --previous 2>/dev/null |
                sed 's/\x1b\[[0-9;]*m//g' | grep -E 'lease|Lease' | tail -5)
              echo "${lease:-no lease errors in its previous container's log}"
