apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: policies-enforced
spec:
  description: >-
    Kyverno's enforced policies (platform/kyverno-policies/) reject a bad object, naming
    the policy: a Deployment that requests amd.com/gpu (gpu-workload-shape), and an
    HTTPRoute on another parent than the https listener of gateway/lab
    (httproute-on-lab-gateway). A Pod whose image has no tag is admitted, as
    images-pinned only audits, and shows up failing it in its namespace's PolicyReport.
    None of it reaches a node.
  steps:
    - try:
        # A GPU Workload is a DaemonSet on the GPU Node (ADR 0006).
        - apply:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gpu-deployment
              spec:
                replicas: 0
                selector:
                  matchLabels: {app: gpu-deployment}
                template:
                  metadata:
                    labels: {app: gpu-deployment}
                  spec:
                    nodeSelector: {k3d-lab/gpu: amd}
                    tolerations:
                      - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
                    containers:
                      - name: gpu
                        image: busybox:1.38
                        resources:
                          limits: {amd.com/gpu: 1}
            expect:
              - check:
                  (contains($error || '', 'gpu-workload-shape')): true
        - apply:
            resource:
              apiVersion: gateway.networking.k8s.io/v1
              kind: HTTPRoute
              metadata:
                name: other-listener
              spec:
                parentRefs:
                  - name: lab
                    namespace: gateway
                    sectionName: http
                hostnames: [policies-enforced.lab.localhost]
                rules:
                  - backendRefs:
                      - {name: web, port: 80}
            expect:
              - check:
                  (contains($error || '', 'httproute-on-lab-gateway')): true
        # Never scheduled: no node has the label, so nothing pulls the image.
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: unpinned
              spec:
                nodeSelector: {k3d-lab/verify: never}
                containers:
                  - name: unpinned
                    image: busybox
        - assert:
            resource:
              apiVersion: wgpolicyk8s.io/v1alpha2
              kind: PolicyReport
              scope:
                kind: Pod
                name: unpinned
              (length(results[?policy == 'images-pinned' && result == 'fail']) > `0`): true
      catch:
        - script:
            content: kubectl -n "$NAMESPACE" get policyreports -o yaml
