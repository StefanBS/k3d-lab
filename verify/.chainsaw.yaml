# Chainsaw's settings for `just verify` (ADR 0004). Each folder here is one check.
apiVersion: chainsaw.kyverno.io/v1alpha2
kind: Configuration
metadata:
  name: verify
spec:
  # Chainsaw's defaults (5s for exec) are too short for waiting on pods and probes.
  # on-ready-nodes.sh gives each node up to 1m, one after another.
  timeouts:
    assert: 2m
    error: 2m
    exec: 5m
  namespace:
    # Each check's namespace is still deleted, without the run waiting for it.
    fastDelete: true
