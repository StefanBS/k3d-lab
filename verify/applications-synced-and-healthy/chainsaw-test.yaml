apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: applications-synced-and-healthy
spec:
  description: >-
    Every ArgoCD Application is Synced and Healthy, and none is in the default project.
    The root Application is among them, and it isn't Healthy while an ApplicationSet
    fails to generate its Applications. The Applications that other checks create,
    labelled k3d-lab/verify, are left out.
  steps:
    - try:
        # The errors below pass when there are no Applications at all.
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: root
                namespace: argocd
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                namespace: argocd
              (metadata.labels."k3d-lab/verify" == null && (status.sync.status != 'Synced' || status.health.status != 'Healthy')): true
        - error:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                namespace: argocd
              (metadata.labels."k3d-lab/verify" == null && spec.project == 'default'): true
      catch:
        - script:
            content: >-
              kubectl -n argocd get applications
              -o custom-columns=NAME:.metadata.name,PROJECT:.spec.project,SYNC:.status.sync.status,HEALTH:.status.health.status
