apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: applications-synced-and-healthy
spec:
  description: >-
    Every ArgoCD Application is Synced and Healthy. The root Application is among them,
    and it isn't Healthy while an ApplicationSet fails to generate its Applications. A
    Joined GPU Node that is off doesn't count: DaemonSet pods missing only from it are
    a WARN (applications-healthy.sh).
  steps:
    - try:
        # The script below passes when there are no Applications at all.
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Application
              metadata:
                name: root
                namespace: argocd
        - script:
            content: ../lib/applications-healthy.sh
      catch:
        - script:
            content: >-
              kubectl -n argocd get applications
              -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status
