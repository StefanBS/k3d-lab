# A client inside a Workload's namespace, so the Workload's policies apply to it.
# policy-denies.sh applies it into each Workload namespace, and deletes it afterwards.
# Its label matches no Workload's, so no Workload's Services or allows pick it up.
apiVersion: v1
kind: Pod
metadata:
  name: network-policy-probe
  labels: {app: network-policy-probe}
spec:
  # `sleep infinity` ignores SIGTERM, so deleting the pod would otherwise wait 30s.
  terminationGracePeriodSeconds: 0
  containers:
    - name: client
      image: busybox:1.38
      command: [sleep, infinity]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
