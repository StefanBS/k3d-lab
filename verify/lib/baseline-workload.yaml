# A Workload with no network policy of its own, which workload-network-baseline.sh applies into
# each namespace it labels as a Workload's: podinfo, with its ports named as the
# Workload baseline expects, and a client to call it from.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
spec:
  replicas: 1
  selector:
    matchLabels: {app: podinfo}
  template:
    metadata:
      labels: {app: podinfo}
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - {name: PODINFO_PORT_METRICS, value: "9797"}
          ports:
            - {name: http, containerPort: 9898}
            - {name: metrics, containerPort: 9797}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
spec:
  selector: {app: podinfo}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  labels: {app: client}
spec:
  # `sleep infinity` ignores SIGTERM, so deleting the pod would otherwise wait 30s.
  terminationGracePeriodSeconds: 0
  containers:
    - name: client
      image: busybox:1.38
      command: [sleep, infinity]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
