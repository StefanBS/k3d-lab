# What has Alloy scrape baseline-workload.yaml's podinfo, as a Workload's folder would: a
# PodMonitor on its port named metrics, which the Workload baseline lets Alloy reach.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: podinfo
spec:
  selector:
    matchLabels: {app: podinfo}
  podMetricsEndpoints:
    - port: metrics
      interval: 10s
