# Probes that the checks use to test the Lab from the inside: a web server behind a
# ClusterIP Service, and a client on every node (the GPU Node included, when Joined).
# Chainsaw applies them into each check's own namespace (deploy-probes.yaml), and
# deletes that namespace afterwards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: traefik/whoami:v1.11
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: client
spec:
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      tolerations:
        - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
      # `sleep infinity` ignores SIGTERM, so deleting the pod would otherwise wait 30s.
      terminationGracePeriodSeconds: 0
      containers:
        - name: client
          image: busybox:1.37
          command: [sleep, infinity]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
