apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: grafana-login
  # Runs only while the Lab has the Feature (scripts/verify.sh).
  labels:
    k3d-lab/feature: observability
spec:
  description: >-
    The Lab login opens Grafana (ADR 0013). From the Host, with the Lab login's password
    from the Secret Store: Grafana signs the Lab login in through Dex as an Admin, that
    sign-in opens Hubble UI without Dex asking again, and Grafana's Break-glass login
    still works. sso-login checks the rest of single sign-on.
  steps:
    - try:
        - script:
            content: ../lib/grafana-login.sh
      catch:
        - script:
            content: kubectl -n "$VERIFY_NS_MONITORING" logs deploy/grafana --tail 20
        - script:
            content: kubectl -n "$VERIFY_NS_SSO" logs -l app=dex --prefix --tail 20
