apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: grafana-healthy
spec:
  description: >-
    From the Host, Grafana answers at https://grafana.lab.localhost with a certificate
    from the Lab CA. Anonymous viewers find its Prometheus, Loki and Tempo datasources
    healthy, and the dashboards from Git (platform/grafana-dashboards/) loaded.
  steps:
    - try:
        - script:
            content: ../lib/host-curl.sh -o /dev/null https://grafana.lab.localhost/api/health
        # Grafana asks each datasource itself; without a login, as the anonymous viewer.
        # It answers 400 when one isn't healthy.
        - script:
            content: |
              bad=0
              for uid in $(yq '.datasources["datasources.yaml"].datasources[].uid' ../../platform/grafana/values.yaml); do
                echo -n "$uid: "
                curl -sS --fail-with-body --retry 5 --retry-all-errors --retry-delay 2 -w '\n' \
                  "https://grafana.lab.localhost/api/datasources/uid/$uid/health" || bad=1
              done
              exit "$bad"
        # The sidecar loads dashboards a few seconds after Grafana starts: until then, 404.
        - script:
            content: |
              for uid in $(jq -r .uid ../../platform/grafana-dashboards/*.json); do
                curl -sS --fail --retry 12 --retry-all-errors --retry-delay 5 \
                  -o /dev/null "https://grafana.lab.localhost/api/dashboards/uid/$uid" || exit 1
              done
