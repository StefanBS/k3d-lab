apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ollama
  # Runs only while the GPU Node is Joined and Ready (scripts/verify.sh).
  labels:
    k3d-lab/gpu: amd
spec:
  description: >-
    Ollama (workloads/ollama/) runs on the GPU Node, answers from the Host at
    https://ollama.lab.localhost through the Gateway, and found the RX 7800 XT (gfx1101)
    through ROCm when it started, rather than falling back to the CPU.
  steps:
    - try:
        # The pod on the GPU Node, which pulls the image of several GB on its first run.
        - assert:
            timeout: 15m
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: ollama
                namespace: ollama
              status:
                desiredNumberScheduled: 1
                numberReady: 1
        # verify.sh exports LAB_CA_CERT.
        - script:
            content: >-
              curl -sS --fail --retry 5 --retry-all-errors --retry-delay 2
              --cacert "$LAB_CA_CERT" https://ollama.lab.localhost/api/version
        # Ollama logs the GPUs it found once, at startup.
        - script:
            content: >-
              kubectl -n ollama logs ds/ollama | grep 'inference compute' | grep -q gfx1101
      catch:
        - script:
            content: >-
              kubectl -n ollama get pods -o wide;
              kubectl -n ollama logs ds/ollama | grep -E 'inference compute|level=(WARN|ERROR)'
