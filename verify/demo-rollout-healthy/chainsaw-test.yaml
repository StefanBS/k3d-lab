apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: demo-rollout-healthy
  # Runs only while the Lab has its Demos (scripts/verify.sh).
  labels:
    k3d-lab/demo: rollouts-demo
spec:
  description: >-
    The demo Rollout (workloads/rollouts-demo/) is Healthy: fully promoted, with all of
    its traffic on the stable version, and it receives the load generator's requests
    through the Gateway. From the Host, the demo answers through the
    Gateway at https://rollouts-demo.lab.localhost, and the Argo Rollouts dashboard's
    address, https://rollouts.lab.localhost, both with a certificate from the Lab CA.
  steps:
    - try:
        # A canary in progress is Progressing, and one the analysis aborted is Degraded.
        - assert:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Rollout
              metadata:
                name: rollouts-demo
                namespace: rollouts-demo
              status:
                phase: Healthy
        - script:
            content: ../lib/demo-receives-load.sh
        - script:
            content: ../lib/host-curl.sh -o /dev/null https://rollouts-demo.lab.localhost/
        # The dashboard's answer is a redirect to Dex, which this doesn't follow:
        # sso-login signs in, and gets the page.
        - script:
            content: ../lib/host-curl.sh -o /dev/null https://rollouts.lab.localhost/
      catch:
        - script:
            content: kubectl -n rollouts-demo get rollout rollouts-demo -o yaml | yq .status
