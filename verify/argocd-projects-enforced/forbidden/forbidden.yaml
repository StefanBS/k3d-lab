# What a Workload's folder must not hold, which argocd-projects-enforced asks ArgoCD to
# sync in the workloads project: a cluster-scoped resource, and a resource in a
# Platform namespace. ArgoCD checks every resource before applying any, so neither is
# ever created while the project refuses them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-projects-enforced
rules: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-projects-enforced
  namespace: monitoring
