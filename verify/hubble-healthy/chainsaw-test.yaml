apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: hubble-healthy
spec:
  description: >-
    Hubble Relay is up and returns flows from every Ready node, the GPU Node included
    when Joined. From the Host, Hubble UI's address, https://hubble.lab.localhost,
    answers with a certificate from the Lab CA.
  steps:
    - try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: hubble-relay
                namespace: kube-system
              status:
                availableReplicas: 1
        - script:
            content: ../lib/hubble-has-flows.sh
        # The answer is a redirect to Dex, which this doesn't follow: sso-login signs in,
        # and gets the page.
        - script:
            content: ../lib/host-curl.sh -o /dev/null https://hubble.lab.localhost/
      catch:
        - script:
            content: kubectl -n kube-system get pods -l 'k8s-app in (hubble-relay, hubble-ui)' -o wide
