apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: kyverno-healthy
spec:
  description: >-
    Kyverno's admission controller, which checks each object as it's admitted, and its
    reports controller, which writes the PolicyReports, are up. Every policy in Git
    (platform/kyverno-policies/) is Ready.
  steps:
    - try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-admission-controller
                namespace: kyverno
              status:
                availableReplicas: 1
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: kyverno-reports-controller
                namespace: kyverno
              status:
                availableReplicas: 1
        - script:
            content: ../lib/kyverno-policies-ready.sh
      catch:
        - script:
            content: kubectl -n kyverno get pods -o wide; kubectl get validatingpolicies
