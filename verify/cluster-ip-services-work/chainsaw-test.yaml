apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cluster-ip-services-work
spec:
  description: >-
    From a client pod on every Ready node, the web Service answers at its DNS name. That
    needs both DNS (itself a ClusterIP Service) and Cilium's ClusterIP translation.
  steps:
    - use:
        template: ../lib/deploy-probes.yaml
    - try:
        - script:
            content: >-
              ../lib/on-ready-nodes.sh "$NAMESPACE" app=client
              -- wget -qO- -T 5 "http://web.$NAMESPACE.svc.cluster.local/"
