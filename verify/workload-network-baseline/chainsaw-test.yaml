apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: workload-network-baseline
spec:
  description: >-
    The Platform's tiers of network policy (platform/workload-network-policy, ADR 0008)
    give a Workload what it needs without a policy of its own, and no more. In
    throwaway namespaces labelled as a Workload's: podinfo answers through the
    Gateway, Alloy scrapes it, pods in its namespace reach each other, none reaches
    another namespace, and a pod in another namespace can't reach it directly. In one
    that's `isolation: strict`, its pods can't reach each other. And one whose Workload
    policy allows the kube-apiserver still can't reach it: the guardrail's deny rule
    drops it. Hubble records each denial as DROPPED by policy.
  steps:
    # The web probe and the client are the other namespace's pods.
    - use:
        template: ../lib/deploy-probes.yaml
    - try:
        - script:
            content: ../lib/workload-network-baseline.sh "$NAMESPACE"
      catch:
        - script:
            content: >-
              kubectl get ciliumclusterwidenetworkpolicies;
              kubectl get namespaces -l k3d-lab/verify=workload-network-baseline --show-labels
