apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sso-login
spec:
  description: >-
    The Lab login opens every UI of the Platform (ADR 0013). From a client pod on every
    Ready node, Dex answers at https://sso.lab.localhost, the name the UIs that sign in
    through it call it by. From the Host, with the Lab login's password from the Secret
    Store: Dex serves the signing keys in its storage, Dex gives a token for the Lab
    login and refuses a wrong password, ArgoCD's API takes that token, the Rollouts
    dashboard and Hubble UI send a request without a session to Dex and one sign-in
    opens both, Grafana signs the Lab login in as an Admin, that sign-in opens ArgoCD
    and Hubble UI without Dex asking again, and ArgoCD's and Grafana's Break-glass logins still work.
  steps:
    - use:
        template: ../lib/deploy-probes.yaml
    - try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: dex
                namespace: sso
              status:
                availableReplicas: 1
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: oauth2-proxy
                namespace: sso
              status:
                availableReplicas: 1
        # CoreDNS picks its entry for the name up by itself, but only a minute or so
        # after ArgoCD applies it (platform/coredns-custom/), so each pod keeps trying
        # for up to 1m, which keeps a few nodes within the exec timeout. busybox's wget
        # doesn't check the certificate; the Host's requests, below, do.
        - script:
            content: >-
              ../lib/on-ready-nodes.sh "$NAMESPACE" app=client
              -- sh -c 'for attempt in $(seq 6); do
              wget -qO /dev/null -T 5 https://sso.lab.localhost/.well-known/openid-configuration && exit 0;
              sleep 5; done; echo "no answer from https://sso.lab.localhost"; exit 1'
        - script:
            content: ../lib/sso-login.sh
      catch:
        - script:
            content: kubectl -n sso get pods -o wide
        - script:
            content: kubectl -n sso logs deploy/oauth2-proxy --tail 20
        - script:
            content: kubectl -n sso logs -l app=dex --prefix --tail 20
        - script:
            content: kubectl -n kube-system get configmap coredns-custom -o yaml | yq .data
