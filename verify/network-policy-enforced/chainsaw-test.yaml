apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: network-policy-enforced
spec:
  description: >-
    Each Workload namespace, found by its label k3d-lab/group=workloads, denies what its
    network policies don't allow, outbound: a probe pod in each can't reach a pod in
    another namespace. Hubble records each attempt as DROPPED by policy. Inbound, the
    denial is covered by workload-network-baseline, in a namespace of its own. What the
    policies allow is covered by demo-rollout-healthy, gpu-node-dns-proxy and comfyui.
  steps:
    - use:
        template: ../lib/deploy-probes.yaml
    - try:
        - script:
            content: ../lib/policy-denies.sh "$NAMESPACE"
      catch:
        - script:
            content: >-
              for ns in $(kubectl get ns -l k3d-lab/group=workloads -o name); do
              kubectl get ciliumnetworkpolicies -n "${ns#namespace/}"; done
