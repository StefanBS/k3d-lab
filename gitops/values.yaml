# The root Application that `just up` applies overrides both, so ArgoCD reads the
# Platform and Workloads from the same Git revision as this chart.
repoURL: https://github.com/StefanBS/k3d-lab.git
revision: main
# Whether the Lab has its Demos, the Workloads with `role: demo` in their component.yaml.
# `just up --demos` and `just demos on` set it in the root Application.
demos: false
# The Platform's Waves, in the order a new Lab installs them, after which comes the rest
# of the Platform, then the Workloads. A Platform component joins one with `wave` in its
# component.yaml, when other components need its CRDs or webhooks to sync. This chart
# can't read component.yaml, so lint checks that every Wave named there is listed here,
# and that each listed has a component.
platformWaves:
  # Only CRDs, which the controllers' own resources need too, such as their ServiceMonitors.
  - crds
  # The controllers whose CRDs and webhooks the rest of the Platform uses.
  - controllers
# The namespaces the Platform installs into, which no Workload may deploy into or
# create. This chart can't read platform/*/component.yaml, so lint checks that every
# Platform component's namespace is here, and that no Workload's is.
platformNamespaces:
  - amd-gpu
  - argo-rollouts
  - argocd
  - cert-manager
  - cilium-secrets
  - external-secrets
  - gateway
  - kube-system
  - kyverno
  - monitoring
  - sso
