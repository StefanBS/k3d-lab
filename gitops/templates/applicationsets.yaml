{{- /*
One ApplicationSet per group: an Application for every <group>/<component>/ folder.
It installs the chart its component.yaml names, with the values.yaml beside it, or,
when component.yaml names no chart, the folder's kustomization.yaml. Each group's
Applications run in the ArgoCD project of the same name (appprojects.yaml).
The `{{`...`}}` parts are left for the ApplicationSet's own templating.
*/}}
{{- range $group := list "platform" "workloads" }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $group }}
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: {{ $.Values.repoURL }}
        revision: {{ $.Values.revision }}
        files:
          - path: {{ $group }}/*/component.yaml
      {{- if and (eq $group "workloads") (not $.Values.demos) }}
      # A Demo is left out of a Lab that wasn't asked for its Demos. A Workload that sets
      # no `role` matches: NotIn also selects a missing key.
      selector:
        matchExpressions:
          - key: role
            operator: NotIn
            values: [demo]
      {{- end }}
  template:
    metadata:
      name: '{{`{{.path.basename}}`}}'
      labels:
        k3d-lab/group: {{ $group }}
    spec:
      project: {{ $group }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{`{{.namespace}}`}}'
      # Git is the only source of truth: anything that drifts from it, or is no longer
      # in it, is put back or removed.
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # Some CRDs, ArgoCD's own among them, are too big for client-side apply.
          - ServerSideApply=true
          # A sync keeps the ignored differences below (ignoreDifferences) as they are live.
          - RespectIgnoreDifferences=true
        # Applications sync in no particular order, Platform and Workloads alike. One
        # that needs another's CRDs or webhook fails until they're up, so it retries
        # forever: once retries run out, ArgoCD never syncs the same commit again by
        # itself. A short cap keeps a new Lab from waiting minutes after they're up.
        retry:
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 30s
      # Argo Rollouts changes two things that Git also sets, and reverting either would
      # undo a canary: it points a Rollout's Services at one version each, by adding the
      # pod-template hash to their selectors, and it shifts traffic by setting the
      # weights of an HTTPRoute's backends. A selector is replaced whole on every apply,
      # so the hash would otherwise be dropped at every sync.
      ignoreDifferences:
        - group: ""
          kind: Service
          jqPathExpressions:
            - .spec.selector["rollouts-pod-template-hash"]
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - .spec.rules[].backendRefs[]?.weight
  # The sources depend on whether component.yaml names a chart, and a Workload's
  # namespace labels and baseline on whether it sets `isolation`, which the template
  # itself can't test: with missingkey=error, a missing key fails it.
  templatePatch: |
    spec:
      {{- if eq $group "workloads" }}
      # The Platform labels each Workload's namespace, so a Workload never labels its
      # own: k3d-lab/group finds them, and k3d-lab/isolation says how strictly their
      # pods are kept apart.
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            k3d-lab/group: workloads
          {{`{{- if hasKey . "isolation" }}`}}
            k3d-lab/isolation: '{{`{{.isolation}}`}}'
          {{`{{- end }}`}}
      {{- end }}
      sources:
      {{`{{- if hasKey . "chart" }}`}}
        - repoURL: '{{`{{.repoURL}}`}}'
          chart: '{{`{{.chart}}`}}'
          targetRevision: '{{`{{.version}}`}}'
          helm:
            # The release `just up` installs with, for the components it bootstraps.
            releaseName: '{{`{{.path.basename}}`}}'
            valueFiles:
              - '$values/{{`{{.path.path}}`}}/values.yaml'
        - repoURL: {{ $.Values.repoURL }}
          targetRevision: {{ $.Values.revision }}
          ref: values
      {{`{{- else }}`}}
        - repoURL: {{ $.Values.repoURL }}
          targetRevision: {{ $.Values.revision }}
          path: '{{`{{.path.path}}`}}'
      {{`{{- end }}`}}
      {{- if eq $group "workloads" }}
      # The baseline's same-namespace allow, which has to live in the Workload's own
      # namespace (ADR 0008), unless the Workload is `isolation: strict`: lint allows
      # no other value.
      {{`{{- if not (hasKey . "isolation") }}`}}
        - repoURL: {{ $.Values.repoURL }}
          targetRevision: {{ $.Values.revision }}
          path: platform/workload-network-policy/same-namespace
      {{`{{- end }}`}}
      {{- end }}
{{- end }}
