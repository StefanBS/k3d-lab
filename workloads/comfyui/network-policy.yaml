# ComfyUI's own rule, on top of the Platform's baseline (ADR 0008), which already lets
# the Gateway reach its port named http, and resolves names through Cilium's DNS
# proxy, which the FQDN rule below needs. The pod runs on the GPU Node, across the
# routed Docker bridge (ADR 0002); Cilium enforces both there as on the k3d Nodes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: comfyui
spec:
  endpointSelector:
    matchLabels: {app: comfyui}
  # What the weights and setup steps download, only when the GPU Node doesn't have it
  # yet (ADR 0007): the weights from Hugging Face, which redirects to its CDN, ComfyUI
  # from GitHub, which redirects to codeload, and its packages from PyPI. ComfyUI
  # itself reaches nothing.
  egress:
    - toFQDNs:
        - matchName: huggingface.co
        - matchPattern: "**.huggingface.co"
        - matchPattern: "**.hf.co"
        - matchName: github.com
        - matchName: codeload.github.com
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
