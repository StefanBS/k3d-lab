# podinfo's own rule, on top of the Platform's baseline (ADR 0008), which already lets
# the Gateway reach its port named http, Alloy its port named metrics, and the load
# generator reach it in the same namespace. Nothing here sends traces: podinfo isn't
# configured to, so there's no egress to Alloy's OTLP ports.
#
# Surprising: a request through the Lab's Gateway is checked against the sender's
# egress policy to the backend pod behind the Gateway, not to the Gateway itself. Envoy
# makes that check, after reading the request, and answers 403 when the policy denies
# it. So the load generator needs egress to podinfo, which the same-namespace allow
# gives it, and none to the Gateway's address.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: podinfo
spec:
  endpointSelector:
    matchLabels: {app: rollouts-demo}
  ingress:
    # The Gateway, whose Envoy has the ingress identity. The HTTP rule allows every
    # request, and sends them through Cilium's L7 proxy, so Hubble sees each one.
    - fromEntities: [ingress]
      toPorts:
        - ports: [{port: http, protocol: TCP}]
          rules:
            http: [{}]
