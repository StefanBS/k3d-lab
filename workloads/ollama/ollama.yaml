# A DaemonSet on the GPU Node rather than a Deployment: while the GPU Node is Left, it
# wants no pod at all, so ArgoCD still calls it Healthy, whereas a Deployment's Pending
# pod would turn it Degraded. There's one GPU, so an update stops the old pod before
# starting the new one, which is the DaemonSet's default.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ollama
spec:
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      nodeSelector: {k3d-lab/gpu: amd}
      tolerations:
        - {key: amd.com/gpu, operator: Exists, effect: NoSchedule}
      # The GPU's devices are world-accessible (gpu-join reports it), so no root.
      # The UID is no one's on the GPU Node; the files it writes there are its own.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ollama
          image: docker.io/ollama/ollama
          env:
            # In its own folder of the GPU Node's model directory, which gpu-join makes
            # writable to every GPU Workload (scripts/gpu-node.sh).
            - {name: OLLAMA_MODELS, value: /models/ollama}
            # Ollama keeps its key in $HOME/.ollama; nothing there needs to last.
            - {name: HOME, value: /home/ollama}
            # Unloads a model after 5 minutes unused, which is Ollama's default, so the
            # VRAM goes back to the GPU Node's owner between experiments.
            - {name: OLLAMA_KEEP_ALIVE, value: 5m}
          ports:
            - {name: http, containerPort: 11434}
          readinessProbe:
            httpGet: {path: /api/version, port: http}
          livenessProbe:
            httpGet: {path: /api/version, port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 1Gi}
            limits:
              amd.com/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: home, mountPath: /home/ollama}
      volumes:
        - name: models
          hostPath:
            path: /var/lib/k3d-lab/models
            type: Directory
        - name: home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: {app: ollama}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ollama
spec:
  parentRefs:
    - name: lab
      namespace: gateway
      sectionName: https
  hostnames:
    - ollama.lab.localhost
  rules:
    - backendRefs:
        - {name: ollama, port: 80}
